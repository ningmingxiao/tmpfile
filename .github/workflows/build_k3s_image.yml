name: github-actions
run-name: ${{ github.actor }} is learning GitHub Actions
on: [push]
jobs:
  setup-cosa-command:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: install docker
        run: |
          sudo apt install -y docker.io make git
      - name: git clone 
        run: |
          sudo git clone https://github.com/ningmingxiao/k3s.git

      - name: build
        shell: bash
        working-directory: k3s
        run: |
          sudo -s
          make local-binary